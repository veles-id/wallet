<header class="header">
  @if (showBackButton()) {
  <button mat-icon-button class="header__back-button" (click)="onBackClick()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  }
  <h1
    class="header__title"
    [class.header__title--with-back-button]="showBackButton()"
  >
    {{ title() }}
  </h1>
</header>
