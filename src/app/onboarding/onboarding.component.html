<div class="onboarding">
  <img src="assets/veles-logo.svg" alt="App Logo" class="header__logo" />

  <img
    src="icons/fingerprint_wght100.svg"
    alt="Fingerprint"
    width="100"
    height="100"
    class="fingerprint-icon"
  />

  <button
    class="onboarding__button"
    mat-flat-button
    (click)="isRegistering ? registerPasskey() : loginWithPasskey()"
    [disabled]="isLoading"
  >
    <mat-spinner *ngIf="isLoading" diameter="20"></mat-spinner>
    <span *ngIf="!isLoading">
      {{ isRegistering ? "REGISTER WITH PASSKEY" : "LOGIN WITH PASSKEY" }}
    </span>
  </button>

  <button
    class="toggle-mode"
    mat-button
    (click)="toggleMode()"
    [disabled]="isLoading"
  >
    {{
      isRegistering
        ? "Already have a passkey? Login"
        : "New user? Create passkey"
    }}
  </button>

  <div *ngIf="error" class="error-message">
    {{ error }}
  </div>
</div>
