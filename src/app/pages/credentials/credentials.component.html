<div class="credentials">
  <div class="credentials__content">
    @if (!hasCredentials() && !isLoading()) {
    <div class="credentials__empty">
      <mat-icon class="credentials__empty-icon">badge</mat-icon>
      <h2 class="credentials__empty-title">No Credentials Yet</h2>
      <p class="credentials__empty-description">
        Start building your digital identity by creating your first verifiable
        credential.
      </p>
    </div>
    } @if (hasCredentials()) {
    <div class="credentials__list">
      @for (credential of credentials(); track credential.credential.id) {
      <app-credential-card
        [credential]="credential"
        (cardClick)="viewCredential($event)"
      />
      }
    </div>
    }

    <button
      mat-flat-button
      class="credentials__create-button"
      (click)="createNewCredential()"
    >
      Create New Credential
    </button>
  </div>
</div>
