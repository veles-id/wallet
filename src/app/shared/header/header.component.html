<header class="header">
  @if (showBackButton()) {
  <button mat-icon-button class="header__back-button" (click)="onBackClick()">
    <mat-icon>arrow_back</mat-icon>
  </button>
  }
  <div
    class="header__content"
    [class.header__content--with-back-button]="showBackButton()"
  >
    @if (title()) {
    <h1 class="header__title">{{ title() }}</h1>
    } @else {
    <ng-content></ng-content>
    }
  </div>
</header>
